name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # For npmjs.org OIDC Trusted Publishing
  packages: write   # For GitHub Packages publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:integration
      
      # Step A: Publish to npmjs.org via OIDC Trusted Publishing
      - name: Publish to npm
        run: npm publish --access public --provenance

      # Step B: Publish to GitHub Packages using GITHUB_TOKEN
      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}