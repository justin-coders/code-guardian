name: CI

on:
  push:
    branches: [dev, main, master, phase*]
  pull_request:
    branches: [dev, main, master, phase*]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:integration
      # The full suite, so the analyzers and rule packs that `test:unit`/`test:integration`
      # do not reach — including the official roadmap Phase 10 security analyzer — are
      # actually exercised by CI.
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --audit-level=critical || true
