name: CI

on:
  push:
    branches: [dev, main, master, phase*]
  pull_request:
    branches: [dev, main, master, phase*]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:integration
      # The official roadmap Phase 10 security analyzer, plus the engine, framework and
      # model/query surfaces it depends on — none of which `test:unit` (tools.test.js) or
      # `test:integration` (integration.test.js) reach, so the analyzer had no CI evidence
      # at all. The official roadmap Phase 11 Testing Analyzer is added here for the same
      # reason: its acquisition (scanner content reads), model projections and rule pack
      # are reached by no other included suite. The official roadmap Phase 12 Code Quality
      # Analyzer joins for the same reason: its CI quality-command classification, model
      # projections and rule pack are reached by no other included suite.
      #
      # This is a named set rather than `npm test`, because the full suite is not yet clean
      # on hosted runners: filesystem.test.js (working-directory/permission cases),
      # repository-scanner.test.js (empty-repository and raw-error cases),
      # security-adversarial.test.js (cwd symlink and executable-location cases) and
      # execution.test.js (relative executable resolution) fail on ubuntu/macos/windows for
      # environment reasons — container permissions, the macOS /var → /private/var symlink,
      # Windows path and spawn behaviour — while passing locally. They are pre-existing and
      # belong to the components those suites cover, not to the analyzer. Widen this step to
      # `npm test` once they are fixed; do not narrow it below the analyzer's own suites.
      - run: >-
          node --test
          tests/rule-engine.test.js
          tests/analyzer-framework.test.js
          tests/security-acquisition.test.js
          tests/security-rules.test.js
          tests/security-analyzer.test.js
          tests/testing-rules.test.js
          tests/testing-analyzer.test.js
          tests/code-quality-rules.test.js
          tests/code-quality-analyzer.test.js
          tests/repository-model.test.js
          tests/repository-query.test.js

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --audit-level=critical || true
